name: Build Windows Pro  
  
on:  
  workflow_dispatch:  
  push:  
    branches: [ "master", "main" ]  
  
env:  
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # 解决 Node.js 20 弃用警告  
  
jobs:  
  windows-pro:  
    runs-on: windows-2022  
  
    steps:  
      - uses: actions/checkout@v4  
        with:  
          submodules: recursive  
          fetch-depth: 0  
  
      - uses: ruby/setup-ruby@v1  
        with:  
          ruby-version: "3.2"  
  
      - name: Build Pro  
        shell: cmd  
        run: |  
          mkdir build_pro  
          cd build_pro  
          cmake -G "Visual Studio 17 2022" -DBUILD_SDLGPU=On -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_PRO=On -DBUILD_WITH_ALL=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..  
          cmake --build . --config MinSizeRel --parallel  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: "tic80-windows-pro"  
          path: |  
            build_pro/bin/tic80.exe  
            build_pro/bin/*.dll
