name: Build Windows Pro  
  
on:  
  workflow_dispatch:   # 手动触发，在 Actions 页面点击 "Run workflow"  
  push:  
    branches: [ "master", "main" ]  
  
jobs:  
  windows-pro:  
    runs-on: windows-2019  
  
    steps:  
      - uses: actions/checkout@v4  
        with:  
          submodules: recursive  
          fetch-depth: 0  
  
      - uses: ruby/setup-ruby@v1  
        with:  
          ruby-version: "2.6"  
  
      - name: Build Pro  
        shell: cmd  
        run: |  
          cd build  
          cmake -G "Visual Studio 16 2019" -DBUILD_SDLGPU=On -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_PRO=On -DBUILD_WITH_ALL=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..  
          cmake --build . --config MinSizeRel --parallel  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: "tic80-windows-pro"  
          path: |  
            build/bin/tic80.exe  
            build/bin/*.dll
