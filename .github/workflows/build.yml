name: Build Windows Pro  
  
on:  
  workflow_dispatch:  
  push:  
    branches: [ "master", "main" ]  
  
jobs:  
  windows-pro:  
    runs-on: windows-2022   # 明确指定 VS 2022 的 runner，避免 windows-latest 漂移  
  
    steps:  
      - uses: actions/checkout@v4   # 修正：v6 不存在，使用 v4  
        with:  
          submodules: recursive  
          fetch-depth: 0  
  
      - uses: ruby/setup-ruby@v1  
        with:  
          ruby-version: "3.2"       # 修正：2.6 已 EOL，使用受支持版本  
  
      - name: Build Pro  
        shell: cmd  
        run: |  
          mkdir build_pro  
          cd build_pro  
          cmake -G "Visual Studio 17 2022" -DBUILD_SDLGPU=On -DCMAKE_BUILD_TYPE=MinSizeRel -DBUILD_PRO=On -DBUILD_WITH_ALL=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..  
          cmake --build . --config MinSizeRel --parallel  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4   # 修正：v6 不存在，使用 v4  
        with:  
          name: "tic80-windows-pro"  
          path: |  
            build_pro/bin/tic80.exe  
            build_pro/bin/*.dll
